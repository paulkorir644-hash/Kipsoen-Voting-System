{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header bg-dark text-white text-center">
                <h4><i class="fas fa-shield-alt"></i> Admin Dashboard Login</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3"><label>Username</label><input type="text" name="username" class="form-control" value="admin" required></div>
                    <div class="mb-3"><label>Password</label><input type="password" name="password" class="form-control" value="admin123" required></div>
                    <button type="submit" class="btn btn-dark w-100">Login as Admin</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
