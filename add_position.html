{% extends "base.html" %}
{% block title %}Add Position{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 500px;">
    <div class="card-header">Add New Position</div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3"><label>Position Name</label><input type="text" name="name" class="form-control" required></div>
            <button type="submit" class="btn btn-primary w-100">Add Position</button>
        </form>
        <div class="text-center mt-3">
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">← Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
