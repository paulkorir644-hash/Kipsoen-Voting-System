{% extends "base.html" %}
{% block title %}Voter Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white text-center">
                <h4><i class="fas fa-vote-yea"></i> Student Voting Portal</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3"><label>Full Name</label><input type="text" name="name" class="form-control" required></div>
                    <div class="mb-3"><label>Student ID Number</label><input type="text" name="student_id" class="form-control" required></div>
                    <button type="submit" class="btn btn-success w-100">Login to Vote</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
